services:
  db:
    image: postgres:17-alpine
    container_name: food_compare_db
    restart: always
    environment:
      POSTGRES_DB: food_compare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
